name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Run shell tests
        run: |
          sudo apt-get update && sudo apt-get install -y bats tmux
          bats tests/

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Smoke test — btop starts under the image locale
        run: |
          docker buildx build --load -t bs:ci --cache-from type=gha .
          docker run --rm --entrypoint bash bs:ci -c '
            echo "LANG=$LANG"
            echo "$LANG" | grep -qiE "utf-?8" || { echo "FAIL: image LANG is not UTF-8 — btop will not start"; exit 1; }
            export TERM=linux
            tmux new-session -d -s t -x 120 -y 30 "btop -p 0 2>/tmp/err; echo EXITED >/tmp/exited; sleep 30"
            sleep 3
            tmux capture-pane -t t -p > /tmp/cap 2>/dev/null || true
            if grep -qi "No UTF-8" /tmp/err /tmp/cap 2>/dev/null; then echo "FAIL: btop locale regression"; cat /tmp/err; exit 1; fi
            if [ -f /tmp/exited ]; then echo "FAIL: btop exited on start"; cat /tmp/err; exit 1; fi
            echo "PASS: btop is running"
          '

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bubblescreen
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
