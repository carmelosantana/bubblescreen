name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Run shell tests
        run: |
          sudo apt-get update && sudo apt-get install -y bats tmux
          bats tests/

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Smoke test — htop + nvtop launch (even in a narrow split pane)
        run: |
          docker buildx build --load -t bs:ci --cache-from type=gha .
          docker run --rm --entrypoint bash bs:ci -c '
            for t in htop nvtop tmux openvt ddcutil modprobe; do command -v "$t" >/dev/null || { echo "FAIL: $t missing"; exit 1; }; done
            export TERM=linux
            # 63 cols is what a split pane gave btop (which needs 80 and refused);
            # htop must run fine at that width.
            tmux new-session -d -s t -x 63 -y 24 "htop 2>/tmp/err; echo EXITED >/tmp/exited; sleep 30"
            sleep 3
            if [ -f /tmp/exited ]; then echo "FAIL: htop exited on start"; cat /tmp/err; exit 1; fi
            tmux capture-pane -t t -p > /tmp/cap 2>/dev/null || true
            grep -qiE "too small|not a terminal|error" /tmp/cap && { echo "FAIL: htop render error"; cat /tmp/cap; exit 1; }
            echo "PASS: htop is running at 63 cols"
          '

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bubblescreen
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
